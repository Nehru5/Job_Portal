<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #87ceeb, #b0e0e6);
    }

    /* ===== NAVBAR ===== */
    .glass-nav {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }

    .nav-title {
      font-size: 18px;
      color: #1f3c4d;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      gap: 15px;
    }

    .nav-actions a {
      text-decoration: none;
      color: #1f3c4d;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: 0.3s ease;
    }

    .nav-actions a:hover {
      background: rgba(31, 140, 190, 0.25);
      transform: translateY(-2px);
    }

    /* ===== FORM ===== */
    .container {
      padding-top: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .glass-form {
      width: 420px;
      padding: 35px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      animation: fadeSlide 1s ease;
    }

    .glass-form h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f3c4d;
      font-weight: 500;
    }

    .glass-form input,
    .glass-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid rgba(31, 60, 77, 0.3);
      background: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      color: #1f3c4d;
      transition: 0.3s ease;
      resize: none;
    }

    .glass-form textarea {
      min-height: 80px;
    }

    .glass-form input:focus,
    .glass-form textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 10px rgba(31, 60, 77, 0.25);
    }

    .glass-form input[type="file"] {
      padding: 8px;
    }

    .glass-form button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(31, 140, 190, 0.85);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .glass-form button:hover {
      background: rgba(31, 140, 190, 1);
      transform: translateY(-2px);
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="glass-nav">
    <div class="nav-title">Update Profile</div>
    <div class="nav-actions">
      <a href="{% url 'recruiter_dashboard' %}">Dashboard</a>
      <a href="{% url 'recruiter_profile' %}">Profile</a>
    </div>
  </nav>

  <!-- FORM -->
  <div class="container">
    <form class="glass-form" action="" method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <h1>Edit Profile</h1>

      <textarea name="bio" placeholder="Enter Bio" required></textarea>
      <textarea name="address" placeholder="Enter Address" required></textarea>
      <input type="text" name="city" placeholder="Enter City" required>
      <input type="text" name="state" placeholder="Enter State" required>
      <input type="file" name="image">

      <button type="submit">Update</button>
    </form>
  </div>

</body>
</html>
