<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applied Jobs</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI", sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#a1c4fd,#c2e9fb);
  padding:60px;
}

h1{
  text-align:center;
  margin-bottom:40px;
  color:#0b3c5d;
}

/* GRID */
.job_posted{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

/* CARD */
.card{
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(14px);
  border-radius:20px;
  padding:30px;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);
  animation: fadeUp 0.8s ease;
  position:relative;
}

.card h2{
  font-size:18px;
  margin-bottom:10px;
  color:#0f2f44;
}

.card span{
  font-weight:600;
  color:#1f8cbe;
}

/* STATUS BADGE */
.status{
  margin-top:10px;
  font-weight:bold;
}

.status.applied{
  color:orange;
}

.status.scheduled{
  color:green;
}

/* CHAT BUTTON */
.chat-btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#3498db;
  color:#fff;
  font-size:14px;
  cursor:pointer;
  transition:0.3s ease;
  box-shadow:0 6px 20px rgba(52,152,219,0.4);
}

.chat-btn:hover{
  background:#2980b9;
  transform: translateY(-2px);
}

/* BADGE */
.badge{
  position:absolute;
  top:15px;
  right:15px;
  background:#1f8cbe;
  color:#fff;
  font-size:12px;
  padding:5px 12px;
  border-radius:20px;
}

/* ANIMATION */
@keyframes fadeUp{
  from{
    opacity:0;
    transform: translateY(30px);
  }
  to{
    opacity:1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<h1>My Applied Jobs</h1>

<div class="job_posted">

{% for job in jobs %}
<div class="card">

  <div class="badge">APPLIED</div>

  <h2>
    <span>{{ job.job_detail.company_name }}</span>
  </h2>

  <p><b>Role:</b> {{ job.job_detail.job_role }}</p>
  <p><b>Location:</b> {{ job.job_detail.job_location }}</p>

  <!-- ✅ STATUS -->
  {% if job.scheduled %}
    <p class="status scheduled">✔ Interview Scheduled</p>
  {% else %}
    <p class="status applied">⏳ Applied</p>
  {% endif %}

  <!-- ✅ CHAT BUTTON -->
  <a href="{% url 'chat_view' job.id %}">
    <button class="chat-btn">Chat</button>
  </a>

</div>
{% empty %}
  <h3 style="text-align:center;">No jobs applied yet</h3>
{% endfor %}

</div>

</body>
</html>
