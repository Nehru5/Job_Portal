<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>Applied Jobs</h2>

{% for job in jobs %}
  <div style="border:1px solid gray; margin:10px; padding:10px;">
    
    <h3>{{ job.job_detail.job_role }}</h3>
    <p>Company: {{ job.job_detail.company_name }}</p>
    
    <p>Status:
      {% if job.scheduled %}
        Interview Scheduled
      {% else %}
        Applied
      {% endif %}
    </p>

    <!-- ✅ CHAT BUTTON -->
    <a href="{% url 'chat_view' job.id %}">Chat</a>

  </div>
{% endfor %}
</body>
</html>
