<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #87ceeb, #b0e0e6);
    }

    /* ===== NAVBAR ===== */
    .glass-nav {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }

    .nav-title {
      font-size: 18px;
      color: #1f3c4d;
      font-weight: 600;
    }

    .nav-actions a {
      text-decoration: none;
      color: #1f3c4d;
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: 0.3s ease;
    }

    .nav-actions a:hover {
      background: rgba(31, 140, 190, 0.25);
      transform: translateY(-2px);
    }

    /* ===== CONTENT WRAPPER ===== */
    .container {
      padding-top: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-card {
      width: 400px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.8s ease;
      position: relative;
    }

    .update-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 8px 14px;
      background: rgba(31, 140, 190, 0.85);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      transition: 0.3s ease;
    }

    .update-btn:hover {
      background: rgba(31, 140, 190, 1);
      transform: translateY(-2px);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .profile-pic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info h2 {
      color: #1f3c4d;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .profile-info p {
      color: #1f3c4d;
      font-size: 14px;
      opacity: 0.9;
    }

    .profile-details {
      margin-top: 20px;
    }

    .profile-details div {
      margin-bottom: 12px;
      font-size: 14px;
      color: #1f3c4d;
    }

    .profile-details span {
      font-weight: 600;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

  </style>
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="glass-nav">
  <div class="nav-title">Candidate Panel</div>

  <div class="nav-actions">
    <a href="{% url 'candidate_dashboard' %}">Dashboard</a>
  </div>
</nav>

<!-- ✅ CONTENT -->
<div class="container">

  <div class="profile-card">

    <a href="{% url 'candidate_profile_update' %}" class="update-btn">
      Update Profile
    </a>

    <div class="profile-header">

      <div class="profile-pic">
        {% if profile_pic %}
          <img src="{{ profile_pic.url }}">
        {% else %}
          <img src="https://via.placeholder.com/90">
        {% endif %}
      </div>

      <div class="profile-info">
        <h2>{{ name }}</h2>
        <p>{{ bio|default:"No bio added" }}</p>
      </div>

    </div>

    <div class="profile-details">
      <div><span>Email:</span> {{ email }}</div>
      <div><span>Address:</span> {{ address|default:"Not provided" }}</div>
    </div>

  </div>

</div>

</body>
</html>
